<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>이벤트 캘린더 대시보드</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 24px; background-color: #0f172a; color: #f8fafc; }

    header { text-align: center; margin-bottom: 28px; }
    h1 { font-size: 2rem; margin-bottom: 16px; color: #38bdf8; font-weight: 800; }

    /* 네비게이션 / 월 선택 탭 */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }

    .tab-btn {
      padding: 8px 16px;
      border: 1px solid #334155;
      border-radius: 20px;
      background-color: #1e293b;
      color: #94a3b8;
      cursor: pointer;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .tab-btn:hover { background-color: #334155; color: #fff; }
    .tab-btn.active { background-color: #0284c7; color: #fff; border-color: #38bdf8; }
    .tab-btn.all-view { background-color: #0d9488; color: #fff; border-color: #2dd4bf; }
    .tab-btn.all-view.active { background-color: #14b8a6; }

    /* 컨테이너 및 섹션 스타일 */
    .section-title {
      font-size: 1.5rem;
      font-weight: 700;
      margin: 32px 0 16px 0;
      padding-bottom: 8px;
      border-bottom: 2px solid #334155;
      color: #38bdf8;
    }

    /* 일별 그리드 레이아웃 (대형 썸네일 강조) */
    .day-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1600px;
      margin: 0 auto 40px auto;
    }

    /* 날짜 카드 스타일 */
    .day-card {
      background: #1e293b;
      border: 1px solid #334155;
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      overflow: hidden;
      transition: transform 0.2s, border-color 0.2s;
    }
    .day-card:hover {
      transform: translateY(-4px);
      border-color: #38bdf8;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .day-number {
      font-size: 1.1rem;
      font-weight: 700;
      color: #f1f5f9;
    }

    /* 대형 썸네일 스타일 */
    .thumbnail-box {
      width: 100%;
      height: 200px; /* 썸네일 크기 극대화 */
      border-radius: 8px;
      background-color: #0f172a;
      background-size: cover;
      background-position: center;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #64748b;
      font-size: 0.85rem;
      border: 1px dashed #334155;
    }

    /* 실시간 이벤트 제목 입력창 */
    .event-input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid #334155;
      background-color: #0f172a;
      color: #f8fafc;
      font-size: 0.9rem;
      outline: none;
      transition: border-color 0.2s;
    }
    .event-input:focus {
      border-color: #38bdf8;
    }
    .event-input::placeholder { color: #64748b; }

    /* 파일 연결 버튼 */
    .file-btn {
      display: block;
      padding: 6px 10px;
      border-radius: 6px;
      background-color: #334155;
      color: #38bdf8;
      text-align: center;
      text-decoration: none;
      font-size: 0.8rem;
      font-weight: 600;
      transition: background-color 0.2s;
    }
    .file-btn:hover { background-color: #0284c7; color: #fff; }
  </style>
</head>
<body>

  <header>
    <h1>2026 이벤트 캘린더</h1>
    <!-- 월 선택 탭 & 12개월 전체 보기 버튼 -->
    <div class="nav-tabs" id="navTabs"></div>
  </header>

  <!-- 그리드가 출력될 메인 영역 -->
  <main id="mainContainer"></main>

  <script>
    // 1. 본인의 Cloudinary Cloud Name으로 지정해주세요!
    const CLOUD_NAME = 'YOUR_CLOUD_NAME';

    // 각 월별 일수 (평년 기준)
    const daysInMonth = [31, 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
    
    // 현재 선택 모드: 1~12 (월별) 또는 'ALL' (12개월 전체 보기)
    let currentMode = 'ALL'; 

    // 상단 탭 네비게이션 생성
    function renderTabs() {
      const tabsContainer = document.getElementById('navTabs');
      tabsContainer.innerHTML = '';

      // 1월 ~ 12월 버튼
      for (let m = 1; m <= 12; m++) {
        const btn = document.createElement('button');
        btn.className = `tab-btn ${currentMode === m ? 'active' : ''}`;
        btn.innerText = `${m}월`;
        btn.onclick = () => {
          currentMode = m;
          renderTabs();
          renderView();
        };
        tabsContainer.appendChild(btn);
      }

      // 마지막: 12개월 전체 보기 버튼
      const allBtn = document.createElement('button');
      allBtn.className = `tab-btn all-view ${currentMode === 'ALL' ? 'active' : ''}`;
      allBtn.innerText = '✨ 12개월 전체 보기';
      allBtn.onclick = () => {
        currentMode = 'ALL';
        renderTabs();
        renderView();
      };
      tabsContainer.appendChild(allBtn);
    }

    // 메인 화면 렌더링 함수
    function renderView() {
      const container = document.getElementById('mainContainer');
      container.innerHTML = '';

      if (currentMode === 'ALL') {
        // 12개월 전체를 순서대로 출력
        for (let m = 1; m <= 12; m++) {
          const sectionTitle = document.createElement('div');
          sectionTitle.className = 'section-title';
          sectionTitle.innerText = `📅 ${m}월`;
          container.appendChild(sectionTitle);

          const grid = createDayGrid(m);
          container.appendChild(grid);
        }
      } else {
        // 선택한 개별 월만 출력
        const grid = createDayGrid(currentMode);
        container.appendChild(grid);
      }
    }

    // 특정 월의 일별 카드 그리드 생성
    function createDayGrid(month) {
      const grid = document.createElement('div');
      grid.className = 'day-grid';

      const totalDays = daysInMonth[month - 1];

      for (let d = 1; d <= totalDays; d++) {
        // Cloudinary Public ID 생성 규칙 (cal-M-D 형식)
        const publicId = `cal-${month}-${d}`;
        const imageUrl = `https://res.cloudinary.com/${CLOUD_NAME}/image/upload/${publicId}`;

        // 저장된 제목 불러오기
        const savedTitle = localStorage.getItem(`event_title_${month}_${d}`) || '';

        const card = document.createElement('div');
        card.className = 'day-card';

        card.innerHTML = `
          <div class="card-header">
            <span class="day-number">${month}월 ${d}일</span>
          </div>

          <!-- 대형 썸네일 영역 -->
          <div class="thumbnail-box" id="thumb-${month}-${d}" style="background-image: url('${imageUrl}');">
          </div>

          <!-- 제목 입력란 -->
          <input type="text" 
                 class="event-input" 
                 placeholder="제목 입력..." 
                 value="${savedTitle}"
                 oninput="saveTitle(${month}, ${d}, this.value)">

          <!-- 파일/링크 연결 버튼 -->
          <a href="#" class="file-btn" onclick="openFile(${month}, ${d}); return false;">
            🔗 상세 파일 보기
          </a>
        `;

        grid.appendChild(card);

        // 이미지 로딩 실패 예외 처리
        const img = new Image();
        img.src = imageUrl;
        img.onerror = () => {
          const box = document.getElementById(`thumb-${month}-${d}`);
          if (box) {
            box.style.backgroundImage = 'none';
            box.innerHTML = '<span>이미지 준비중</span>';
          }
        };
      }

      return grid;
    }

    // 이벤트 제목 자동 저장 함수 (LocalStorage)
    function saveTitle(month, day, text) {
      localStorage.setItem(`event_title_${month}_${day}`, text);
    }

    // 파일/상세 페이지 연동 예시 함수
    function openFile(month, day) {
      alert(`${month}월 ${day}일 연결 페이지/파일로 이동합니다.`);
    }

    // 초기화
    window.onload = () => {
      renderTabs();
      renderView();
    };
  </script>
</body>
</html>
